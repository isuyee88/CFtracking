name = "cf-tracking"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
JWT_EXPIRES_IN = "24h"
CDN_CACHE_TTL = "300"
CACHE_TTL = "21600"
ENABLED_REGIONS = "HK,CN"
REALTIME_ENABLED = true
SSE_ENABLED = true
# Cloudflare API 配置
CF_ACCOUNT_ID = "d1215a30b84b673ef0367010b0e78c10"
# 缓存更新令牌(用于手动触发缓存更新API)
CACHE_UPDATE_TOKEN = "cftrack-cache-update-2026-secure-token"

# Cloudflare Queues配置 (替代Cron,无数量限制)
[[queues.producers]]
queue = "cache-refresh-queue"
binding = "CACHE_REFRESH_QUEUE"

[triggers]
# 不再使用Cron触发器，改用Queues实现更灵活的缓存刷新

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "cf-tracking-db"
database_id = "c20392f5-c14c-42fa-a3e7-fa9bdb5b4b76"
migrations_dir = "schema/migrations"



# KV 命名空间
[[kv_namespaces]]
binding = "UNIQUENESS_KV"
id = "7cdc9c88e1964bff954835d91f98bd74"

# Durable Objects - 原有 DO
[durable_objects]
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDurableObject"

[[durable_objects.bindings]]
name = "COUNTER_DO"
class_name = "CounterDurableObject"

[[durable_objects.bindings]]
name = "QUEUE_DO"
class_name = "QueueDurableObject"

[[durable_objects.bindings]]
name = "UNIQUE_DO"
class_name = "UniquenessDurableObject"

[[durable_objects.bindings]]
name = "USER_PREFERENCE_DO"
class_name = "UserPreferenceDurableObject"

# 已废弃但线上仍有 binding 的 DO（保留兼容）
[[durable_objects.bindings]]
name = "CACHE_DO"
class_name = "CacheDurableObject"

[[durable_objects.bindings]]
name = "EVENT_DO"
class_name = "EventActor"

[[durable_objects.bindings]]
name = "STATS_DO"
class_name = "StatsActor"

# Durable Objects - 新增 Tracking Stats DO（用于实时统计）
[[durable_objects.bindings]]
name = "TRACKING_STATS_DO"
class_name = "TrackingStatsDO"

# Durable Objects 迁移配置
# Cloudflare 免费计划要求所有 DO 使用 new_sqlite_classes
# 注意：修改已有 migration 可能导致问题，但这是 Cloudflare 要求
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDurableObject", "CounterDurableObject", "QueueDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UniquenessDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["UserPreferenceDurableObject"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["CacheDurableObject"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["EventActor"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["StatsActor"]

[[migrations]]
tag = "v7"
new_sqlite_classes = []

[[migrations]]
tag = "v8"
new_sqlite_classes = []

[[migrations]]
tag = "v9"
new_sqlite_classes = ["TrackingStatsDO"]

# Assets - 前端静态资源
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

[dev]
port = 12334

[build]
command = "cd frontend && npm install && npm run build && cd .. && node scripts/deploy-hook.js"
