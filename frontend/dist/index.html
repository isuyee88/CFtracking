        border: 1px solid rgba(227, 233, 242, 0.78);
        box-shadow: 0 14px 32px rgba(15, 23, 42, 0.035);
      }

      @keyframes boot-shimmer {
        from {
          background-position: 200% 0;
        }
        to {

        }
      }

      @media (max-width: 720px) {
