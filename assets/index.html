    <script>
      (function() {
        try {
          const saved = localStorage.getItem('cftracking-theme') || 'system';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const dark = saved === 'dark' || (saved === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark-mode', dark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = dark ? '#0c0e10' : '#fafafa';
          document.documentElement.style.color = dark ? '#e2e2e5' : '#111111';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#121416' : '#ffffff');
        } catch (_) {}
      })();
    </script>
