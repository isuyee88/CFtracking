# Self-Evolving Skill System
# File: trae-self-evolving/skills/self-evolving/skill.yaml
# Description: Main skill definition for the self-evolving system

name: self-evolving-skill
version: 1.0.0
description: |
  A self-improving skill system that learns from interactions,
  optimizes based on feedback, and evolves to better serve the user.

category: core
priority: critical

trigger_conditions:
  - pattern: "learn"
  - pattern: "remember"
  - pattern: "improve"
  - pattern: "optimize"
  - pattern: "fix"

actions:
  learn:
    description: "Learn from user feedback and interactions"
    triggers:
      - user_correction
      - success_feedback
      - failure_report

  optimize:
    description: "Optimize skill behavior based on usage patterns"
    triggers:
      - usage_analysis
      - performance_review

  resolve:
    description: "Resolve conflicts between skills"
    triggers:
      - conflict_detected
      - skill_collision

  rollback:
    description: "Rollback to previous skill state"
    triggers:
      - user_request
      - auto_rollback_trigger

entities:
  - skill
  - user_preference
  - error_pattern
  - optimization_rule
  - evolution_log
  - conflict_record

relationships:
  - skill USES user_preference
  - skill CORRECTED_BY error_pattern
  - skill IMPROVED_BY optimization_rule
  - error_pattern CAUSES evolution_log
  - skill CONFLICTS_WITH skill
  - evolution_log TRIGGERS optimization_rule
