name = "cf-tracking"
main = "src/index.ts"
compatibility_date = "2024-12-30"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "development"
JWT_EXPIRES_IN = "24h"
CDN_CACHE_TTL = "300"
CACHE_TTL = "21600"
ENABLED_REGIONS = "HK,CN"
REALTIME_ENABLED = true
SSE_ENABLED = true
AI_OPTIMIZATION_MODEL = "@cf/meta/llama-3.1-8b-instruct"
AI_OPTIMIZATION_GATEWAY_ID = ""
AUTH_MODE = "on"

[[queues.producers]]
queue = "cache-refresh-queue"
binding = "CACHE_REFRESH_QUEUE"

[[queues.consumers]]
queue = "cache-refresh-queue"
max_batch_size = 10
max_batch_timeout = 5

[[d1_databases]]
binding = "DB"
database_name = "cf-tracking-db"
migrations_dir = "schema/migrations"

[[kv_namespaces]]
binding = "UNIQUENESS_KV"

[[r2_buckets]]
binding = "HOSTED_ASSETS_BUCKET"
bucket_name = "cf-tracking-hosted-assets-dev"

[durable_objects]
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDurableObject"

[[durable_objects.bindings]]
name = "COUNTER_DO"
class_name = "CounterDurableObject"

[[durable_objects.bindings]]
name = "QUEUE_DO"
class_name = "QueueDurableObject"

[[durable_objects.bindings]]
name = "UNIQUE_DO"
class_name = "UniquenessDurableObject"

[[durable_objects.bindings]]
name = "USER_PREFERENCE_DO"
class_name = "UserPreferenceDurableObject"

[[durable_objects.bindings]]
name = "CACHE_DO"
class_name = "CacheDurableObject"

[[durable_objects.bindings]]
name = "EVENT_DO"
class_name = "EventActor"

[[durable_objects.bindings]]
name = "STATS_DO"
class_name = "StatsActor"

[[durable_objects.bindings]]
name = "TRACKING_STATS_DO"
class_name = "TrackingStatsDO"

[[durable_objects.sqlite_namespaces]]
name = "TRACKING_STATS_DO_SQLITE"
class_name = "TrackingStatsDO"

[[migrations]]
tag = "v1"
new_classes = ["SessionDurableObject", "CounterDurableObject", "QueueDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UniquenessDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["UserPreferenceDurableObject"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["CacheDurableObject"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["EventActor"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["StatsActor"]

[[migrations]]
tag = "v7"
new_sqlite_classes = []

[[migrations]]
tag = "v8"
new_sqlite_classes = []

[[migrations]]
tag = "v9"
new_sqlite_classes = ["TrackingStatsDO"]

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/events/*", "/hosted-assets/*", "/health", "/sw.js", "/__bootstrap/*", "/__bootstrap-object/*"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *", "0 * * * *", "0 0 * * *", "0 2 * * *"]

[dev]
port = 12342
